version: "3.9"

services:
  # ─── Redis (job queue & cache) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # C8: Bind to loopback only — Redis has no password in this compose file
    # so exposing it on 0.0.0.0 would allow anyone on the network to connect.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # C7: No source bind-mount in production — image contains the app code.
      # For local development, uncomment the line below and add --reload to CMD.
      # - ./backend:/app
      - ./models:/app/models:ro
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MODELS_DIR=/app/models
      - FOMM_DIR=/app/models/first-order-model
      - WAV2LIP_DIR=/app/models/Wav2Lip
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # C7: No --reload in production — it exposes the source tree and slows startup
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ─── Celery Worker (AI processing) ───────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # C7: No source bind-mount in production
      # - ./backend:/app
      - ./models:/app/models:ro
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      - MODELS_DIR=/app/models
      - FOMM_DIR=/app/models/first-order-model
      - WAV2LIP_DIR=/app/models/Wav2Lip
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.workers.tasks worker --loglevel=info --concurrency=1 -Q deepfake

  # ─── Frontend Web ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    # m52: Frontend depends on API being healthy before serving
    depends_on:
      - api

volumes:
  uploads_data:
  outputs_data:
